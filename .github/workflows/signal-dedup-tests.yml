name: Signal dedup tests

on:
  push:
    branches:
      - feature/signal-dedup-m1
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile changed modules
        run: python -m py_compile config.py signal_deduplicator.py monitors.py utils.py
      - name: Run event dedup unit tests
        run: python -m unittest discover -s tests -v
